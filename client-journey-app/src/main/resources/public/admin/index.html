<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Client Journey Admin</title></head>
<body>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
  <label for="locale">Language:</label>
  <select id="locale"><option value="en">English</option><option value="ru">Русский</option></select>
  <script>
    async function loadLocale(locale){
      const messages=await fetch(`/admin/i18n/${locale}.json`).then(r=>r.json());
      document.getElementById('title').textContent=messages.title;
      document.getElementById('subtitle').textContent=messages.subtitle;
    }
    const localeSel=document.getElementById('locale');
    localeSel.addEventListener('change',()=>loadLocale(localeSel.value));
    loadLocale('en');
  </script>
</body>
</html>
