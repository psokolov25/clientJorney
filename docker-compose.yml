version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: client-journey-app:local
    environment:
      CLIENT_JOURNEY_STORAGE_TYPE: postgres
      CLIENT_JOURNEY_VISIT_CLIENT: dry-run
      DB_URL: jdbc:postgresql://postgres:5432/client_journey
      DB_USER: client_journey
      DB_PASSWORD: client_journey
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: client_journey
      POSTGRES_USER: client_journey
      POSTGRES_PASSWORD: client_journey
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

volumes:
  postgres_data:
